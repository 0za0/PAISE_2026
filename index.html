
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Software Engineer Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Software Engineer Simulator</h1>

  <h2>Tokens: <span id="tokens">0</span></h2>
  <p>Tokens pro Sekunde: <span id="tps">0</span></p>

  <button onclick="writeCode()">Code schreiben (+1)</button>

  <h2>Automatisierungen</h2>
  <button onclick="buyJunior()">
    Junior Dev kaufen – <span id="price">10</span> Tokens
  </button>
  <p>Junior Devs: <span id="juniors">0</span></p>

  <h2>Technical Debt</h2>
  <p>Debt: <span id="debt">0</span></p>
  <button onclick="refactor()">Refactoring Sprint</button>

  <script src="script.js"></script>
</body>
</html>
